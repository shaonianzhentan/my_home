<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>书签管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-blue-700 mb-8">书签管理</h1>
        <!-- 新增/编辑表单 -->
        <form id="bookmark-form" class="bg-white rounded shadow p-6 mb-8 flex flex-col gap-4">
            <input type="hidden" id="edit-index">
            <div>
                <label class="block mb-1 text-gray-700" for="name">名称</label>
                <input type="text" id="name" class="w-full border rounded px-3 py-2" placeholder="请输入名称" required>
            </div>
            <div>
                <label class="block mb-1 text-gray-700" for="url">网址</label>
                <input type="url" id="url" class="w-full border rounded px-3 py-2" placeholder="请输入网址" required>
            </div>
            <div>
                <label class="block mb-1 text-gray-700" for="category">分类</label>
                <input list="category-list" id="category" class="w-full border rounded px-3 py-2"
                    placeholder="请输入或选择分类">
                <datalist id="category-list"></datalist>
            </div>
            <div>
                <span class="block mb-1 text-gray-700">仅管理员可见</span>
                <div class="flex items-center gap-6">
                    <label class="inline-flex items-center">
                        <input type="radio" name="admin" id="admin-false" value="false" class="form-radio" checked>
                        <span class="ml-2">否</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="admin" id="admin-true" value="true" class="form-radio">
                        <span class="ml-2">是</span>
                    </label>
                </div>
            </div>
            <div class="flex gap-4">
                <button type="submit" id="submit-btn"
                    class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700 flex-1">保存</button>
                <button type="button" id="cancel-btn"
                    class="bg-gray-300 text-gray-700 rounded px-4 py-2 hover:bg-gray-400 flex-1 hidden">取消编辑</button>
            </div>
        </form>
        <!-- 书签列表 -->
        <div class="bg-white rounded shadow p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">书签列表</h2>
            <ul id="bookmark-list" class="divide-y"></ul>
            <div id="empty-tip" class="text-gray-400 text-center py-8 hidden">暂无书签，快去添加吧！</div>
        </div>
    </div>
    <script>
        // API 地址
        const API_URL = '/api/my_home/website';

        const homeassistant = parent.document.querySelector('home-assistant')
        let fetchApi = homeassistant ? homeassistant.hass.fetchWithAuth : fetch

        // DOM 元素
        const form = document.getElementById('bookmark-form');
        const nameInput = document.getElementById('name');
        const urlInput = document.getElementById('url');
        const categoryInput = document.getElementById('category');
        const categoryList = document.getElementById('category-list');
        const editIndexInput = document.getElementById('edit-index');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const list = document.getElementById('bookmark-list');
        const emptyTip = document.getElementById('empty-tip');
        const adminRadios = document.getElementsByName('admin');

        let bookmarks = [];

        // 获取书签
        async function fetchBookmarks() {
            const res = await fetchApi(API_URL);
            bookmarks = await res.json();
            renderList();
            renderCategoryOptions();
        }

        // 渲染分类下拉选项
        function renderCategoryOptions() {
            const categories = Array.from(new Set(bookmarks.map(b => b.category).filter(Boolean)));
            categoryList.innerHTML = categories.map(c => `<option value="${c}"></option>`).join('');
        }

        // 渲染列表
        function renderList() {
            list.innerHTML = '';
            if (!bookmarks.length) {
                emptyTip.classList.remove('hidden');
                return;
            }
            emptyTip.classList.add('hidden');
            bookmarks.forEach((b, idx) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between py-3";
                li.innerHTML = `
          <div>
            <a href="${b.url}" target="_blank" class="text-blue-600 font-medium hover:underline">${b.name}</a>
            <span class="text-gray-500 text-sm ml-2">${b.category || ''}</span>
            <span class="text-xs ml-2 px-2 py-1 rounded ${b.admin ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-200 text-gray-500'}">
                ${b.admin ? '仅管理员' : '所有人'}
            </span>
          </div>
          <div class="flex gap-2">
            <button class="edit-btn text-green-600 hover:underline" data-idx="${idx}">编辑</button>
            <button class="delete-btn text-red-500 hover:underline" data-url="${b.url}">删除</button>
          </div>
        `;
                list.appendChild(li);
            });
        }

        // 获取admin字段值
        function getAdminValue() {
            for (const radio of adminRadios) {
                if (radio.checked) {
                    return radio.value === "true";
                }
            }
            return false;
        }

        // 设置admin字段值
        function setAdminValue(val) {
            for (const radio of adminRadios) {
                radio.checked = (radio.value === (val ? "true" : "false"));
            }
        }

        // 新增/编辑提交（POST，url相同自动更新）
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();
            const category = categoryInput.value.trim();
            const admin = getAdminValue();
            // editIndex 仅用于UI，不影响接口
            if (!name || !url) return;

            await fetchApi(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url, category, admin })
            });

            resetForm();
            fetchBookmarks();
        });

        // 编辑
        list.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-btn')) {
                const idx = e.target.getAttribute('data-idx');
                const b = bookmarks[idx];
                nameInput.value = b.name;
                urlInput.value = b.url;
                categoryInput.value = b.category || '';
                setAdminValue(!!b.admin);
                urlInput.readOnly = true;
                editIndexInput.value = idx;
                submitBtn.textContent = '保存修改';
                cancelBtn.classList.remove('hidden');
            }
            // 删除
            if (e.target.classList.contains('delete-btn')) {
                const url = e.target.getAttribute('data-url');
                if (confirm('确定要删除该书签吗？')) {
                    fetchApi(API_URL, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    }).then(fetchBookmarks);
                }
            }
        });

        // 取消编辑
        cancelBtn.addEventListener('click', () => {
            resetForm();
        });

        // 重置表单
        function resetForm() {
            form.reset();
            editIndexInput.value = '';
            urlInput.readOnly = false;
            submitBtn.textContent = '保存';
            cancelBtn.classList.add('hidden');
            setAdminValue(false);
        }

        // 初始化
        fetchBookmarks();
    </script>
</body>
